<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Equipo de Investigación</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #121212; --card-bg: #1e1e1e; --modal-bg: #282828;
      --text-main: #e4e6eb; --text-muted: #a0a3a7; --border-color: #333333;
      --accent-color: #2c2f33; --accent-hover: #3f434a;
      
      --status-data: #e3f2fd; --status-data-text: #0d47a1;
      --status-writing: #f3e5f5; --status-writing-text: #4a148c;
      --status-review: #fff3e0; --status-review-text: #e65100;
      --status-sent-bg: rgba(158, 158, 158, 0.1); --status-sent-text: #9e9e9e;

      --color-general: #78909c;
      --color-events: #66bb6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 2rem; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    
    .filters-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .filter-btn:hover { background: var(--accent-hover); color: var(--text-main); }
    .filter-btn.active { background: var(--text-main); color: var(--bg-color); font-weight: 600; border-color: var(--text-main); }

    .global-tools { display: flex; gap: 1rem; }
    .btn { padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 6px; text-decoration: none; color: var(--text-main); background: var(--card-bg); font-weight: 500; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn-primary { background: var(--text-main); color: var(--bg-color); border: none; }
    .btn-primary:hover { background: #c2c4c8; }
    
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; height: 100%; transition: opacity 0.2s; }
    .card.completed { opacity: 0.65; border-top-color: #555 !important; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .card-title { font-size: 1.05rem; font-weight: 600; }
    .researcher-name { font-size: 0.85rem; color: var(--text-muted); }
    
    .status-badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 12px; font-weight: 600; white-space: nowrap; }
    .status-data { background-color: var(--status-data); color: var(--status-data-text); }
    .status-writing { background-color: var(--status-writing); color: var(--status-writing-text); }
    .status-review { background-color: var(--status-review); color: var(--status-review-text); }
    .status-sent { background-color: var(--status-sent-bg); color: var(--status-sent-text); border: 1px solid rgba(158,158,158,0.2); }
    
    .log-preview { background: rgba(0,0,0,0.25); padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; border-left: 3px solid var(--text-muted); color: var(--text-muted); cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; flex-grow: 1; }
    .log-preview:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
    .log-text { margin: 6px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; color: var(--text-main); }
    .log-hint { font-size: 0.7rem; color: var(--text-muted); margin-top: auto; padding-top: 4px; }
    
    .card-actions { display: flex; gap: 0.5rem; margin-top: auto; align-items: center; }
    .next-meeting-info { font-size: 0.75rem; color: #81c784; background: rgba(129, 199, 132, 0.1); padding: 0.3rem 0.5rem; border-radius: 4px; border: 1px solid rgba(129, 199, 132, 0.2); flex: 1; text-align: center; text-decoration: none; display: block; }
    .next-meeting-info:hover { background: rgba(129, 199, 132, 0.2); }
    .no-meeting { font-size: 0.75rem; color: var(--text-muted); flex: 1; text-align: center; }

    .section-block { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color); }
    .section-block h2 { margin-bottom: 1.5rem; font-size: 1.3rem; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal { background: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .modal h3 { font-size: 1.2rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.6rem; border-radius: 6px; font-family: inherit; }
    input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; border-style: dashed; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
    
    .calendar-event { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-radius: 6px; background: rgba(255,255,255,0.03); border-left: 4px solid #fff; margin-bottom: 0.5rem; }
    .event-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .event-title { font-weight: 600; font-size: 0.95rem; }
    .event-date { font-size: 0.75rem; color: var(--text-muted); }
    .event-tag { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; display: inline-block; width: fit-content; font-weight: bold; color: #121212; }
    
    .history-list { display: flex; flex-direction: column; gap: 1rem; }
    .history-item { padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
    .history-item:last-child { border-bottom: none; }
    .history-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .btn-delete { background: transparent; border: 1px solid #ef5350; color: #ef5350; border-radius: 4px; padding: 0.2rem 0.5rem; font-size: 0.75rem; cursor: pointer; }
    .btn-delete:hover { background: rgba(239, 83, 80, 0.1); }
    .history-text { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Organización de Investigación</h1>
      <p style="color: var(--text-muted); margin-top: 0.3rem;">Panel de control del equipo</p>
    </div>
    <div class="global-tools">
      <button class="btn" onclick="abrirCalendario()">📅 Calendario Global</button>
      <button id="login-btn" class="btn" onclick="abrirLogin()">Iniciar Sesión</button>
    </div>
  </header>

  <div class="filters-bar">
    <button class="filter-btn active" onclick="filtrar('todas', this)">Todas</button>
    <button class="filter-btn" onclick="filtrar('abiertas', this)">En marcha / Activas</button>
    <button class="filter-btn" onclick="filtrar('completadas', this)">Completadas (Enviado)</button>
    <button class="filter-btn" onclick="filtrar('reunion', this)">📌 Con reunión programada</button>
  </div>

  <main>
    <!-- Líneas de Investigación Activas (0 al 12) -->
    <div class="dashboard-grid" id="lines-container">
      <p style="color: var(--text-muted);">Cargando organización...</p>
    </div>

    <!-- Sección de Redes Sociales y Eventos -->
    <section class="section-block" id="diffusion-block">
      <h2>Difusión, Redes y Eventos</h2>
      <div class="dashboard-grid" id="diffusion-container"></div>
    </section>

    <!-- Sección final de Líneas Completadas -->
    <section class="section-block" id="completed-block">
      <h2>Líneas Completadas / Enviadas</h2>
      <div class="dashboard-grid" id="completed-container"></div>
    </section>
  </main>

  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>Acceso Equipo</h3>
      <div class="form-group"><label>Correo electrónico</label><input type="email" id="login-email"></div>
      <div class="form-group"><label>Contraseña</label><input type="password" id="login-password"></div>
      <p id="login-error" style="color: #ef5350; font-size: 0.85rem; display: none;"></p>
      <div class="modal-actions">
        <button class="btn" onclick="cerrarLogin()">Cancelar</button>
        <button class="btn btn-primary" onclick="iniciarSesion()">Entrar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>Actualizar Espacio</h3>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label>Responsable / Investigador/a</label><input type="text" id="edit-investigador"></div>
      <div class="form-group"><label>Título</label><input type="text" id="edit-titulo"></div>
      <div class="form-group" id="estado-group">
        <label>Estado Actual</label>
        <select id="edit-estado">
          <option value="Recolección de datos">Recolección de datos</option>
          <option value="Procesamiento de datos">Procesamiento de datos</option>
          <option value="En escritura">En escritura</option>
          <option value="En revisión">En revisión</option>
          <option value="Planteamiento">Planteamiento</option>
          <option value="Enviado">Enviado</option>
          <option value="Activo">Activo</option>
        </select>
      </div>
      <div class="form-group"><label>Enlace de Meet / Externo</label><input type="text" id="edit-meet"></div>
      <div class="form-group"><label>Añadir nueva nota a la Bitácora</label><textarea id="edit-log" rows="4" placeholder="Escribe tu actualización..."></textarea></div>
      <div class="modal-actions">
        <button class="btn" onclick="cerrarEdit()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarCambios()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="history-modal">
    <div class="modal">
      <h3 id="history-title">Historial de Actualizaciones</h3>
      <div id="history-content" class="history-list"><p style="color: var(--text-muted); font-size: 0.9rem;">Cargando...</p></div>
      <div class="modal-actions"><button class="btn" onclick="cerrarHistorial()">Cerrar</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="calendar-modal">
    <div class="modal" style="max-width: 600px;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        <h3 style="border: none; margin: 0; padding: 0;">📅 Calendario de Reuniones</h3>
        <button class="btn btn-primary" id="btn-nueva-reunion" style="font-size: 0.8rem; display: none;" onclick="abrirCrearReunion()">+ Agendar Reunión</button>
      </div>
      <div id="calendar-events-list" style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Cargando reuniones...</p>
      </div>
      <div class="modal-actions"><button class="btn" onclick="cerrarCalendario()">Cerrar</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="new-event-modal">
    <div class="modal" style="max-width: 400px;">
      <h3>Agendar Nueva Reunión</h3>
      <div class="form-group"><label>Título del Evento</label><input type="text" id="event-title"></div>
      <div class="form-group"><label>Fecha y Hora</label><input type="datetime-local" id="event-datetime"></div>
      <div class="form-group"><label>Asociar a Línea</label><select id="event-line-select"></select></div>
      <div class="modal-actions">
        <button class="btn" onclick="cerrarCrearReunion()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarReunion()">Agendar</button>
      </div>
    </div>
  </div>

  <script>
    const CORREOS_ADMINISTRADORA = ["pmanuben@ucm.es", "josea@ucm.es"];
    const supabaseUrl = 'https://scszmpsfejbmrwzgjgtw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjc3ptcHNmZWpibXJ3emdqZ3R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTc0MzcsImV4cCI6MjEwMzgzMzQzN30.lN08jqs-AXHRLSSVVwasLRQJlZx4bjFaT8RR0Vf0pjE';
    const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let sesionActiva = false;
    let usuarioEmail = "";
    let lineasCache = [];
    let reunionesCache = [];
    let filtroActual = 'todas';

    clienteSupabase.auth.onAuthStateChange((event, session) => {
      sesionActiva = !!session;
      usuarioEmail = session ? session.user.email : "";
      
      const loginBtn = document.getElementById('login-btn');
      if (sesionActiva) {
        loginBtn.textContent = 'Cerrar Sesión (' + usuarioEmail.split('@')[0] + ')';
        loginBtn.onclick = cerrarSesion;
      } else {
        loginBtn.textContent = 'Iniciar Sesión';
        loginBtn.onclick = abrirLogin;
      }
      cargarDatosCompletos();
    });

    function esAdmin() { return CORREOS_ADMINISTRADORA.includes(usuarioEmail); }

    function abrirLogin() { document.getElementById('login-modal').style.display = 'flex'; document.getElementById('login-error').style.display = 'none'; }
    function cerrarLogin() { document.getElementById('login-modal').style.display = 'none'; }
    
    async function iniciarSesion() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const { error } = await clienteSupabase.auth.signInWithPassword({ email, password: pass });
      if (error) {
        document.getElementById('login-error').textContent = 'Credenciales incorrectas.';
        document.getElementById('login-error').style.display = 'block';
      } else { cerrarLogin(); }
    }
    
    async function cerrarSesion() { await clienteSupabase.auth.signOut(); }

    function obtenerColorLinea(num) {
      if (num === 0) return 'var(--color-general)';
      if (num >= 13 && num <= 14) return '#9c27b0'; // Redes sociales
      if (num === 15) return 'var(--color-events)'; // Conferencias y eventos
      if (num >= 16) return '#9e9e9e'; // Completadas (Gris atenuado)
      const colores = ['#26a69a', '#ab47bc', '#ffa726', '#42a5f5', '#ec407a', '#26a69a', '#ab47bc', '#ffa726', '#42a5f5', '#ec407a', '#26a69a'];
      return colores[num % colores.length];
    }

    async function cargarDatosCompletos() {
      const [{ data: lineas }, { data: reuniones }] = await Promise.all([
        clienteSupabase.from('lineas_investigacion').select('*').order('numero_linea', { ascending: true }),
        clienteSupabase.from('reuniones').select('*').order('fecha_hora', { ascending: true })
      ]);

      if (!lineas) return;
      lineasCache = lineas;
      reunionesCache = reuniones || [];

      renderizarTarjetas();
    }

    function filtrar(tipo, btn) {
      filtroActual = tipo;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderizarTarjetas();
    }

    function renderizarTarjetas() {
      const container = document.getElementById('lines-container');
      const diffusionContainer = document.getElementById('diffusion-container');
      const completedContainer = document.getElementById('completed-container');
      
      container.innerHTML = '';
      diffusionContainer.innerHTML = '';
      completedContainer.innerHTML = '';

      const ahora = new Date();

      lineasCache.forEach(linea => {
        const esCompletada = (linea.estado_actual === 'Enviado');
        const proximaReunion = reunionesCache.find(r => r.linea_id === linea.id && new Date(r.fecha_hora) >= ahora);

        if (filtroActual === 'abiertas' && (esCompletada || linea.numero_linea >= 13)) return;
        if (filtroActual === 'completadas' && !esCompletada) return;
        if (filtroActual === 'reunion' && !proximaReunion) return;

        let badgeHTML = '';
        if (linea.numero_linea > 0 && linea.numero_linea <= 12) {
          let badgeClass = 'status-data';
          if (linea.estado_actual === 'En escritura') badgeClass = 'status-writing';
          if (linea.estado_actual === 'En revisión') badgeClass = 'status-review';
          badgeHTML = `<span class="status-badge ${badgeClass}">${linea.estado_actual}</span>`;
        } else if (esCompletada) {
          badgeHTML = `<span class="status-badge status-sent">Enviado</span>`;
        }

        let botonEditar = '';
        if (sesionActiva) {
          botonEditar = `<button class="btn btn-primary" style="font-size: 0.80rem; padding: 0.3rem 0.6rem;" onclick="abrirEdit('${linea.id}', '${escapeQuotes(linea.nombre_investigador)}', '${escapeQuotes(linea.titulo_linea)}', '${linea.estado_actual}', '${linea.enlace_meet || ''}', ${linea.numero_linea})">Editar</button>`;
        }

        let reunionHTML = `<span class="no-meeting">Sin reunión próxima</span>`;
        if (proximaReunion) {
          const fechaFmt = new Date(proximaReunion.fecha_hora).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          reunionHTML = `<a href="${linea.enlace_meet || '#'}" target="_blank" class="next-meeting-info" title="${proximaReunion.titulo}">📌 ${fechaFmt}</a>`;
        }

        const colorLinea = obtenerColorLinea(linea.numero_linea);

        const card = document.createElement('article');
        card.className = `card ${esCompletada ? 'completed' : ''}`;
        card.style.borderTop = `4px solid ${colorLinea}`;
        card.innerHTML = `
          <div class="card-header">
            <div>
              <h2 class="card-title">${linea.titulo_linea}</h2>
              <span class="researcher-name">${linea.nombre_investigador}</span>
            </div>
            ${badgeHTML}
          </div>
          
          <div class="log-preview" onclick="abrirHistorial('${linea.id}', '${escapeQuotes(linea.titulo_linea)}')">
            <strong>Última actualización:</strong>
            <div class="log-text">${linea.ultima_actualizacion || ''}</div>
            <div class="log-hint">👉 Clic para ver el historial</div>
          </div>

          <div class="card-actions">
            ${reunionHTML}
            ${botonEditar}
          </div>
        `;

        // Destino de las tarjetas según su número
        if (linea.numero_linea >= 16) {
          completedContainer.appendChild(card);
        } else if (linea.numero_linea >= 13) {
          diffusionContainer.appendChild(card);
        } else {
          container.appendChild(card);
        }
      });

      // Ocultar bloques enteros si el filtro los vacía
      document.getElementById('diffusion-block').style.display = (diffusionContainer.children.length === 0 && filtroActual !== 'todas') ? 'none' : 'block';
      document.getElementById('completed-block').style.display = (completedContainer.children.length === 0 && filtroActual !== 'todas') ? 'none' : 'block';
    }

    function escapeQuotes(str) { return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : ''; }

    async function abrirHistorial(id, titulo) {
      document.getElementById('history-title').textContent = 'Historial: ' + titulo;
      document.getElementById('history-modal').style.display = 'flex';
      const content = document.getElementById('history-content');
      content.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Cargando historial...</p>';

      const { data } = await clienteSupabase.from('bitacora').select('*').eq('linea_id', id).order('fecha', { ascending: false });
      
      if (!data || data.length === 0) {
        content.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No hay notas guardadas aún.</p>';
        return;
      }

      const admin = esAdmin();
      content.innerHTML = data.map(nota => {
        const fechaFormat = new Date(nota.fecha).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        let botonBorrar = admin ? `<button class="btn-delete" onclick="borrarNota('${nota.id}', '${id}', '${escapeQuotes(titulo)}')">🗑️ Borrar</button>` : '';

        return `
          <div class="history-item">
            <div class="history-meta">
              <span>📅 ${fechaFormat} | ✍️ ${nota.autor.split('@')[0]}</span>
              ${botonBorrar}
            </div>
            <div class="history-text">${nota.mensaje}</div>
          </div>
        `;
      }).join('');
    }
    
    function cerrarHistorial() { document.getElementById('history-modal').style.display = 'none'; }

    async function borrarNota(notaId, lineaId, titulo) {
      if (!confirm('¿Borrar esta actualización?')) return;
      await clienteSupabase.from('bitacora').delete().eq('id', notaId);
      abrirHistorial(lineaId, titulo);
    }

    function abrirEdit(id, inv, tit, est, meet, numLinea) {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-investigador').value = inv;
      document.getElementById('edit-titulo').value = tit;
      document.getElementById('edit-estado').value = est;
      document.getElementById('edit-meet').value = meet;
      document.getElementById('edit-log').value = "";
      
      const admin = esAdmin();
      document.getElementById('edit-investigador').disabled = !admin;
      document.getElementById('edit-titulo').disabled = !admin;
      document.getElementById('edit-meet').disabled = !admin;

      if (numLinea === 0) {
        document.getElementById('estado-group').style.display = 'none';
      } else {
        document.getElementById('estado-group').style.display = 'flex';
        document.getElementById('edit-estado').disabled = !admin;
      }

      document.getElementById('edit-modal').style.display = 'flex';
    }
    
    function cerrarEdit() { document.getElementById('edit-modal').style.display = 'none'; }

    async function guardarCambios() {
      const id = document.getElementById('edit-id').value;
      const nuevaNota = document.getElementById('edit-log').value.trim();
      const admin = esAdmin();
      let updates = {};

      if (admin) {
        updates.nombre_investigador = document.getElementById('edit-investigador').value;
        updates.titulo_linea = document.getElementById('edit-titulo').value;
        updates.enlace_meet = document.getElementById('edit-meet').value;
        const selectEstado = document.getElementById('edit-estado');
        if (selectEstado.style.display !== 'none') updates.estado_actual = selectEstado.value;
      }

      if (nuevaNota !== "") updates.ultima_actualizacion = nuevaNota;

      if (Object.keys(updates).length > 0) {
        await clienteSupabase.from('lineas_investigacion').update(updates).eq('id', id);
      }

      if (nuevaNota !== "") {
        await clienteSupabase.from('bitacora').insert({ linea_id: id, autor: usuarioEmail, mensaje: nuevaNota });
      }

      cerrarEdit();
      cargarDatosCompletos();
    }

    async function abrirCalendario() {
      document.getElementById('calendar-modal').style.display = 'flex';
      document.getElementById('btn-nueva-reunion').style.display = sesionActiva ? 'block' : 'none';
      
      const lista = document.getElementById('calendar-events-list');
      lista.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Cargando reuniones...</p>';

      const { data } = await clienteSupabase.from('reuniones').select('*, lineas_investigacion(titulo_linea, enlace_meet, numero_linea)').order('fecha_hora', { ascending: true });

      if (!data || data.length === 0) {
        lista.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No hay reuniones agendadas.</p>';
        return;
      }

      const admin = esAdmin();
      lista.innerHTML = data.map(rev => {
        const fechaRev = new Date(rev.fecha_hora).toLocaleString('es-ES', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        const lineaInfo = rev.lineas_investigacion || { titulo_linea: 'General', enlace_meet: '#', numero_linea: 0 };
        const colorLinea = obtenerColorLinea(lineaInfo.numero_linea);
        let botonBorrar = admin ? `<button class="btn-delete" onclick="borrarReunion('${rev.id}')">🗑️ Borrar</button>` : '';

        return `
          <div class="calendar-event" style="border-left-color: ${colorLinea};">
            <div class="event-info">
              <span class="event-tag" style="background-color: ${colorLinea};">${lineaInfo.titulo_linea}</span>
              <span class="event-title">${rev.titulo}</span>
              <span class="event-date">📅 ${fechaRev}</span>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <a href="${lineaInfo.enlace_meet || '#'}" target="_blank" class="btn" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">🔗 Enlace</a>
              ${botonBorrar}
            </div>
          </div>
        `;
      }).join('');
    }

    function cerrarCalendario() { document.getElementById('calendar-modal').style.display = 'none'; }

    async function abrirCrearReunion() {
      const select = document.getElementById('event-line-select');
      select.innerHTML = lineasCache.map(l => `<option value="${l.id}">${l.titulo_linea}</option>`).join('');
      document.getElementById('event-title').value = '';
      document.getElementById('event-datetime').value = '';
      document.getElementById('new-event-modal').style.display = 'flex';
    }

    function cerrarCrearReunion() { document.getElementById('new-event-modal').style.display = 'none'; }

    async function guardarReunion() {
      const titulo = document.getElementById('event-title').value.trim();
      const fechaHora = document.getElementById('event-datetime').value;
      const lineaId = document.getElementById('event-line-select').value;

      if (!titulo || !fechaHora) { alert('Rellena el título y la fecha.'); return; }

      await clienteSupabase.from('reuniones').insert({ titulo, fecha_hora: fechaHora, linea_id: lineaId });
      cerrarCrearReunion();
      abrirCalendario();
      cargarDatosCompletos();
    }

    async function borrarReunion(id) {
      if (!confirm('¿Eliminar esta reunión?')) return;
      await clienteSupabase.from('reuniones').delete().eq('id', id);
      abrirCalendario();
      cargarDatosCompletos();
    }
  </script>
</body>
</html>
