<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Equipo de Investigación</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --modal-bg: #282828;
      --text-main: #e4e6eb;
      --text-muted: #a0a3a7;
      --border-color: #333333;
      --accent-color: #2c2f33;
      --accent-hover: #3f434a;
      
      --status-data-bg: rgba(66, 165, 245, 0.15); 
      --status-data-text: #90caf9;
      --status-writing-bg: rgba(171, 71, 188, 0.15);
      --status-writing-text: #ce93d8;
      --status-review-bg: rgba(255, 183, 77, 0.15);
      --status-review-text: #ffe082;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .global-tools {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-main);
      background: var(--card-bg);
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-primary { background: var(--text-main); color: var(--bg-color); border: none; }
    .btn-primary:hover { background: #c2c4c8; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .card-title { font-size: 1.05rem; font-weight: 600; }
    .researcher-name { font-size: 0.85rem; color: var(--text-muted); }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-processing { background-color: var(--status-data-bg); color: var(--status-data-text); border: 1px solid rgba(66,165,245,0.3); }
    .status-writing { background-color: var(--status-writing-bg); color: var(--status-writing-text); border: 1px solid rgba(171,71,188,0.3); }
    .status-review { background-color: var(--status-review-bg); color: var(--status-review-text); border: 1px solid rgba(255,183,77,0.3); }

    .log-preview {
      background: rgba(0,0,0,0.25);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 3px solid var(--text-muted);
      color: #c4c6c9;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }

    /* Modales (Ventanas superpuestas) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label { font-size: 0.85rem; color: var(--text-muted); }

    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 6px;
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Organización de Investigación</h1>
      <p style="color: var(--text-muted); margin-top: 0.3rem;">Panel de control del equipo (7 líneas)</p>
    </div>
    
    <div class="global-tools">
      <a href="#" class="btn">📅 Calendario Global</a>
      <a href="#" class="btn btn-primary">🎥 Meet Grupal</a>
      <button id="login-btn" class="btn">Iniciar Sesión</button>
    </div>
  </header>

  <main>
    <div class="dashboard-grid" id="lines-container">
      <p style="color: var(--text-muted);">Cargando líneas de investigación...</p>
    </div>
  </main>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>Actualizar Línea de Investigación</h3>
      <input type="hidden" id="edit-id">
      
      <div class="form-group">
        <label>Investigador/a</label>
        <input type="text" id="edit-investigador">
      </div>

      <div class="form-group">
        <label>Título de la Línea</label>
        <input type="text" id="edit-titulo">
      </div>

      <div class="form-group">
        <label>Estado Actual</label>
        <select id="edit-estado">
          <option value="Recolección de datos">Recolección de datos</option>
          <option value="Procesamiento de datos">Procesamiento de datos</option>
          <option value="En escritura">En escritura</option>
          <option value="En revisión">En revisión</option>
          <option value="Publicado">Publicado</option>
        </select>
      </div>

      <div class="form-group">
        <label>Enlace de Meet Individual</label>
        <input type="text" id="edit-meet">
      </div>

      <div class="form-group">
        <label>Nueva entrada para la Bitácora / Diario</label>
        <textarea id="edit-log" rows="3" placeholder="Escribe aquí las novedades del proyecto..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarCambios()">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://scszmpsfejbmrwzgjgtw.supabase.co';
    const supabaseKey = 'sb_publishable_aucqQqfo34REmhTysre1Og_u8I2JVgk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Cargar las 7 líneas desde Supabase
    async function cargarLineas() {
      const container = document.getElementById('lines-container');
      const { data, error } = await supabase.from('lineas_investigacion').select('*').order('created_at', { ascending: true });

      if (error) {
        container.innerHTML = `<p style="color: #ef5350;">Error al cargar datos: ${error.message}</p>`;
        return;
      }

      container.innerHTML = '';

      data.forEach(linea => {
        let badgeClass = 'status-processing';
        if (linea.estado_actual === 'En escritura') badgeClass = 'status-writing';
        if (linea.estado_actual === 'En revisión') badgeClass = 'status-review';

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div>
              <h2 class="card-title">${linea.titulo_linea}</h2>
              <span class="researcher-name">${linea.nombre_investigador}</span>
            </div>
            <span class="status-badge ${badgeClass}">${linea.estado_actual}</span>
          </div>
          
          <div class="log-preview">
            <strong>Última actualización:</strong><br>
            ${linea.ultima_actualizacion || 'Sin entradas recientes.'}
          </div>

          <div class="card-actions">
            <a href="${linea.enlace_meet || '#'}" target="_blank" class="btn" style="flex: 1; text-align: center; font-size: 0.85rem;">🎥 Meet</a>
            <button class="btn btn-primary" style="flex: 1; font-size: 0.85rem;" onclick="abrirModal('${linea.id}', '${escapeQuotes(linea.nombre_investigador)}', '${escapeQuotes(linea.titulo_linea)}', '${linea.estado_actual}', '${linea.enlace_meet || ''}', '${escapeQuotes(linea.ultima_actualizacion || '')}')">Editar</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Funciones de la ventana emergente (Modal)
    function abrirModal(id, investigador, titulo, estado, meet, log) {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-investigador').value = investigador;
      document.getElementById('edit-titulo').value = titulo;
      document.getElementById('edit-estado').value = estado;
      document.getElementById('edit-meet').value = meet;
      document.getElementById('edit-log').value = log;
      
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function guardarCambios() {
      const id = document.getElementById('edit-id').value;
      const investigador = document.getElementById('edit-investigador').value;
      const titulo = document.getElementById('edit-titulo').value;
      const estado = document.getElementById('edit-estado').value;
      const meet = document.getElementById('edit-meet').value;
      const log = document.getElementById('edit-log').value;

      const { error } = await supabase.from('lineas_investigacion').update({
        nombre_investigador: investigador,
        titulo_linea: titulo,
        estado_actual: estado,
        enlace_meet: meet,
        ultima_actualizacion: log
      }).eq('id', id);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        cerrarModal();
        cargarLineas(); // Recargar la vista inmediatamente
      }
    }

    // Cargar líneas al iniciar
    cargarLineas();
  </script>
</body>
</html>
